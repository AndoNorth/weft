[project]
name = "dsy-worker"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "temporalio",
    "dsy-artifactclient",
    "dsy-events",
    "dsy-keys",
    "dsy-obs",
    "dsy-servicekit",
    "dsy-stages",
    "dsy-temporal",
    "dsy-workflow",
]

# One extra per pool image: the library its child processes run, and the binary it needs on PATH.
[project.optional-dependencies]
compile = ["uv==0.11.21", "dsy-compile"]
simulate = ["dsy-runtime"]
aggregate = ["dsy-aggregate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
