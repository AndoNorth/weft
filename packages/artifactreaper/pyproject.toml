[project]
name = "dsy-artifactreaper"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pyyaml",
    "temporalio",
    "dsy-artifactclient",
    "dsy-artifactindex",
    "dsy-servicekit",
    "dsy-storecheck",
    "dsy-temporal",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
