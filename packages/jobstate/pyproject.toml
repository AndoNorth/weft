[project]
name = "dsy-jobstate"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]", "pydantic", "pyyaml"]

[project.entry-points."dsy.migrations"]
