[project]
name = "dsy-artifactclient"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3",
    "pydantic",
    "pytest",
    "pyyaml",
    "dsy-artifactindex",
    "dsy-compat",
    "dsy-events",
    "dsy-storecheck",
]

[project.entry-points.pytest11]
dsy_artifactclient = "dsy_artifactclient.testing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
