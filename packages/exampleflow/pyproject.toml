[project]
name = "dsy-exampleflow"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "temporalio",
    "dsy-workflow",
]

[project.entry-points."dsy.workflow.modules"]
exampleflow = "dsy_exampleflow:workers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
