[project]
name = "dsy-workflow"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "temporalio",
    "dsy-artifactclient",
    "dsy-artifactindex",
    "dsy-artifactreaper",
    "dsy-compile",
    "dsy-events",
    "dsy-eventstore",
    "dsy-itest",
    "dsy-jobdoc",
    "dsy-jobpatch",
    "dsy-jobstate",
    "dsy-keys",
    "dsy-obs",
    "dsy-plan",
    "dsy-runtime",
    "dsy-servicekit",
    "dsy-stages",
    "dsy-temporal",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["dsy-clusterkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
