[project]
name = "dsy-admission"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "temporalio",
    "dsy-broker",
    "dsy-compat",
    "dsy-events",
    "dsy-eventstore",
    "dsy-jobstate",
    "dsy-keys",
    "dsy-obs",
    "dsy-servicekit",
    "dsy-stages",
    "dsy-temporal",
    "dsy-workflow",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["dsy-clusterkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
