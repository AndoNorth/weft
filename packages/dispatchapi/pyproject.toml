[project]
name = "dsy-dispatchapi"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "temporalio",
    "dsy-artifactclient",
    "dsy-artifactindex",
    "dsy-broker",
    "dsy-compile",
    "dsy-events",
    "dsy-eventstore",
    "dsy-itest",
    "dsy-jobcheck",
    "dsy-jobpatch",
    "dsy-jobstate",
    "dsy-keys",
    "dsy-obs",
    "dsy-plan",
    "dsy-servicekit",
    "dsy-stages",
    "dsy-temporal",
    "dsy-workflow",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["dsy-acceptance", "dsy-clusterkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
