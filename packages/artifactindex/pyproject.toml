[project]
name = "dsy-artifactindex"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]", "pydantic", "pyyaml", "dsy-events"]

[project.entry-points."dsy.migrations"]
artifactindex = "dsy_artifactindex.migrations"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
