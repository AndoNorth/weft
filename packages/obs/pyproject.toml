[project]
name = "dsy-obs"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# The dependency set of every module the package will hold, declared once so the wheel test catches an undeclared one.
dependencies = [
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "pyroscope-io",
    "pyyaml",
    "temporalio",
    "dsy-events",
    "dsy-servicekit",
]

# The state inputs exporter reads the job tables, so only the process that runs it installs this.
[project.optional-dependencies]
stateops = ["dsy-stateops"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
