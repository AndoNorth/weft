[project]
name = "dsy-aggregate"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "dsy-artifactclient",
    "dsy-kernel",
    "dsy-storecheck",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
