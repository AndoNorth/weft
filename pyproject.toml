[project]
name = "disyard"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

# Workspace members are installed through the dev group, because a plain `uv run` installs only the root project.
[tool.uv.sources]
dsy-acceptance = { workspace = true }
dsy-admission = { workspace = true }
dsy-aggregate = { workspace = true }
dsy-artifactclient = { workspace = true }
dsy-artifactindex = { workspace = true }
dsy-artifactreaper = { workspace = true }
dsy-broker = { workspace = true }
dsy-clusterkit = { workspace = true }
dsy-compat = { workspace = true }
dsy-compile = { workspace = true }
dsy-dispatchapi = { workspace = true }
dsy-events = { workspace = true }
dsy-eventstore = { workspace = true }
dsy-exampleflow = { workspace = true }
dsy-itest = { workspace = true }
dsy-jobcheck = { workspace = true }
dsy-jobdoc = { workspace = true }
dsy-jobexamples = { workspace = true }
dsy-jobpatch = { workspace = true }
dsy-jobstate = { workspace = true }
dsy-jobtools = { workspace = true }
dsy-kernel = { workspace = true }
dsy-keys = { workspace = true }
dsy-migrate = { workspace = true }
dsy-obs = { workspace = true }
dsy-placement = { workspace = true }
dsy-plan = { workspace = true }
dsy-runtime = { workspace = true }
dsy-servicekit = { workspace = true }
dsy-stages = { workspace = true }
dsy-stateops = { workspace = true }
dsy-storecheck = { workspace = true }
dsy-temporal = { workspace = true }
dsy-worker = { workspace = true }
dsy-workflow = { workspace = true }
dsy-workloads = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
    "dsy-acceptance",
    "dsy-admission",
    "dsy-aggregate",
    "dsy-artifactclient",
    "dsy-artifactindex",
    "dsy-artifactreaper",
    "dsy-broker",
    "dsy-clusterkit",
    "dsy-compat",
    "dsy-compile",
    "dsy-dispatchapi",
    "dsy-events",
    "dsy-eventstore",
    "dsy-exampleflow",
    "dsy-itest",
    "dsy-jobcheck",
    "dsy-jobdoc",
    "dsy-jobexamples",
    "dsy-jobpatch",
    "dsy-jobstate",
    "dsy-jobtools",
    "dsy-kernel",
    "dsy-keys",
    "dsy-migrate",
    "dsy-obs",
    "dsy-placement",
    "dsy-plan",
    "dsy-runtime",
    "dsy-servicekit",
    "dsy-stages",
    "dsy-stateops",
    "dsy-storecheck",
    "dsy-temporal",
    "dsy-worker",
    "dsy-workflow",
    "dsy-workloads",
]

[tool.pytest.ini_options]
# Several packages have a tests/test_vectors.py, so test modules are imported by path and not by basename.
addopts = "--import-mode=importlib --strict-markers"
# A hung test fails with a stack dump at 5 minutes. The thread method works under xdist and on tests that hold a container.
timeout = 300
timeout_method = "thread"
markers = [
    "integration: needs containers started through dsy_itest",
    "e2e: needs the running cluster, run by scripts/e2e.sh and deselected by scripts/test.sh",
    "seam: the seam smoke level, the toy service and the layering rules, run by `just seam`",
    "pair: needs a store and a database in one session, which holds two containers",
    "isolated: starts containers of its own, runs only under `-m isolated` and holds at most two containers",
    "cluster: reads a real backend of a running stack",
    "slow: large results, deselected by scripts/test.sh and run only when selected",
]
