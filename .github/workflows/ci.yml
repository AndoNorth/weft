name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Setting the repository variable CI_ENABLED to false skips every job.
  # A commit message containing [skip ci] also skips runs natively.
  # A pull request that changes documentation only takes the docs path of scripts/ci.sh, a push to main the full path.
  # The full path runs the checks and one test job per shard of scripts/ci-shards.sh side by side, and the docs path
  # skips the test jobs. The check job sums them up, so it is the one check to require.
  changes:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      shards: ${{ steps.classify.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        # The pull request checkout is a merge commit whose first parent is the base branch.
        run: |
          mode=full
          [ "$EVENT" != pull_request ] || mode=$(git diff --name-only --no-renames HEAD^1 HEAD | scripts/ci-paths.sh)
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"
          shards=$(scripts/ci-shards.sh)
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop -c just ci --checks
      - name: Reproducibility check
        if: ${{ needs.changes.outputs.mode == 'full' }}
        run: |
          drv() {
            mkdir "$1" && git archive HEAD | tar -x -C "$1"
            (cd "$1" && nix eval --raw .#devShells.x86_64-linux.default.drvPath)
          }
          a=$(drv "$RUNNER_TEMP/export-a")
          b=$(drv "$RUNNER_TEMP/export-b")
          echo "$a"
          [ "$a" = "$b" ] || { echo "drvPath differs: $b" >&2; exit 1; }

  test:
    needs: changes
    if: ${{ needs.changes.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard runs to the end, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # The image builds of the integration tests read their wheels and release assets from this cache first.
      - name: Restore the build download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/disyard/build
          key: build-downloads-${{ hashFiles('uv.lock', 'nix/wasm-tools.nix', 'deploy/versions.yaml') }}
          restore-keys: build-downloads-
      # uv keeps the downloaded wheels and the python-qpid-proton build from its sdist here.
      # The key prefix is this job's own, so no other workflow can save an empty cache under it first.
      - name: Restore the uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-test-${{ hashFiles('uv.lock') }}
          restore-keys: uv-test-
      - run: nix develop -c just ci --shard ${{ matrix.shard }}
      # The unit and integration reports of the shard, kept even when the shard fails.
      - name: Upload the JUnit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: .pytest_cache/junit-${{ matrix.shard }}-*.xml
          if-no-files-found: warn
          retention-days: 30

  check:
    needs: [changes, checks, test]
    if: ${{ always() && vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          MODE: ${{ needs.changes.outputs.mode }}
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "path=$MODE checks=$CHECKS test=$TEST"
          [ "$CHECKS" = success ]
          [ "$TEST" = success ] || { [ "$MODE" = docs ] && [ "$TEST" = skipped ]; }
